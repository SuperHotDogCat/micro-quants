    // ============================================================
    // Utils
    // ============================================================

    function createHistogram(values, bins = 40) {

      const min = Math.min(...values);
      const max = Math.max(...values);

      const binWidth = (max - min) / bins;

      const counts = new Array(bins).fill(0);

      for (const v of values) {

        let idx = Math.floor((v - min) / binWidth);

        if (idx >= bins) {
          idx = bins - 1;
        }

        counts[idx]++;
      }

      const labels = [];

      for (let i = 0; i < bins; i++) {

        const x = min + i * binWidth;

        labels.push(x.toFixed(4));
      }

      return {
        labels,
        counts,
        min,
        max,
        binWidth
      };
    }

    // ============================================================
    // Create charts
    // ============================================================

    const chartsDiv = document.getElementById("charts");

    for (const symbol of data.symbols) {

      const returns = data.symbol_to_returns[symbol];

      const var95 = data.symbol_to_var[symbol];

      const hist = createHistogram(returns, 50);

      // ============================================================
      // Create HTML
      // ============================================================

      const container = document.createElement("div");

      container.className = "chart-container";

      container.innerHTML = `
        <h2>${symbol}</h2>
        <p><strong>95% VaR:</strong> ${(var95 * 100).toFixed(2)}%</p>
        <canvas id="chart-${symbol}"></canvas>
      `;

      chartsDiv.appendChild(container);

      // ============================================================
      // VaR vertical line
      // ============================================================

      const varX = -var95;

      // plugin
      const varLinePlugin = {
        id: "varLine",

        afterDraw(chart) {

          const {
            ctx,
            chartArea: { top, bottom },
            scales: { x }
          } = chart;

          const xPixel = x.getPixelForValue(varX.toFixed(4));

          ctx.save();

          ctx.beginPath();

          ctx.moveTo(xPixel, top);

          ctx.lineTo(xPixel, bottom);

          ctx.lineWidth = 2;

          ctx.strokeStyle = "red";

          ctx.stroke();

          ctx.fillStyle = "red";

          ctx.fillText("VaR", xPixel + 5, top + 20);

          ctx.restore();
        }
      };

      // ============================================================
      // Chart
      // ============================================================

      const ctx = document.getElementById(`chart-${symbol}`);

      new Chart(ctx, {

        type: "bar",

        data: {
          labels: hist.labels,
          datasets: [
            {
              label: "Return Distribution",
              data: hist.counts
            }
          ]
        },

        options: {

          responsive: true,

          plugins: {

            title: {
              display: true,
              text: `${symbol} Return Distribution`
            },

            legend: {
              display: false
            }
          },

          scales: {

            x: {
              title: {
                display: true,
                text: "Return"
              }
            },

            y: {
              title: {
                display: true,
                text: "Frequency"
              }
            }
          }
        },

        plugins: [varLinePlugin]
      });
    }
