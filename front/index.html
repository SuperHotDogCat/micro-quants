    // ====== labels（時間軸）を作る ======
    const firstSymbol = data.symbols[0];
    const labels = data.market_data[firstSymbol].historical.map(d =>
      d.date.split(" ")[0]
    );

    // ====== datasets作成 ======
    const colors = ["red", "blue", "green"];

    const datasets = data.symbols.map((symbol, i) => {
      return {
        label: symbol,
        data: data.market_data[symbol].historical.map(d => d.close),
        borderColor: colors[i % colors.length],
        fill: false,
        tension: 0.2
      };
    });

    // ====== chart描画 ======
    const ctx = document.getElementById("chart");

    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: datasets
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: "top"
          },
          title: {
            display: true,
            text: "Close Price Time Series"
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Date"
            }
          },
          y: {
            title: {
              display: true,
              text: "Price"
            }
          }
        }
      }
    });
